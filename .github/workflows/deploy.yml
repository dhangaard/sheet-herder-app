name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to droplet
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/sheet_herder_app_deploy
          chmod 600 ~/.ssh/sheet_herder_app_deploy
          ssh-keyscan -H "$DROPLET_IP" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/sheet_herder_app_deploy" dist/ "$DROPLET_USER@$DROPLET_IP:/home/jetty/deployment/caddy/site/sheet-herder-app/"